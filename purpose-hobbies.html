<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY_HONNIES · Purpose | MOB1S</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .purpose-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6rem 2.5rem;
    }
    .purpose-card {
      max-width: 720px;
      width: 100%;
      background: var(--carbon-card);
      border: 1px solid var(--border-subtle);
      border-radius: 2px;
      padding: 3rem;
    }
    .purpose-card .section-header {
      margin-bottom: 2.5rem;
    }
    .purpose-body {
      font-size: 0.88rem;
      color: var(--white-dim);
      line-height: 1.95;
      letter-spacing: 0.01em;
    }
    .purpose-body p {
      margin-bottom: 1.2rem;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 2.5rem;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--neon);
      text-decoration: none;
      transition: gap 0.3s;
    }
    .back-link:hover {
      gap: 0.8rem;
    }

    /* --- Gallery Entry --- */
    .gallery-entry {
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(191, 255, 0, 0.25);
    }
    .gallery-entry h2 {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: var(--neon);
      margin-bottom: 1rem;
    }
    .gallery-thumbs {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 1rem;
    }
    .thumb-item {
      width: 80px;
      height: 80px;
      overflow: hidden;
      border: 1px solid rgba(191, 255, 0, 0.25);
      border-radius: 2px;
      transition: transform 0.2s ease;
    }
    .thumb-item:hover {
      transform: scale(1.05);
    }
    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .gallery-link {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--neon);
      text-decoration: none;
      transition: gap 0.3s;
    }
    .gallery-link:hover {
      gap: 0.6rem;
    }
  </style>
</head>
<body>
  <div class="carbon-overlay"></div>
  <div class="telemetry-grid"></div>

  <main class="purpose-page">
    <article class="purpose-card">
      <div class="section-header">
        <span class="section-index">SECTOR 02 · PURPOSE</span>
        <h2 class="section-title">MY<span class="title-accent">_HOBBIES</span></h2>
        <div class="header-ruler"></div>
      </div>
      <div class="purpose-body">
        <p>兴趣爱好是我们生活的重要的一部分，它们让我们的生活更加丰富多彩。</p>
        <p>我喜欢的东西很多，但随着时间的推移，有些兴趣爱好可能会淡化，有些则会持续下去。</p>
        <p>记录一下我现在喜欢的东西，不然以后忘了，我的记性太差。</p>
        <p>——</p>
      </div>
      <div id="hobbyGalleries"></div>

      <a href="index.html#hobbies" class="back-link">&larr; BACK TO INDEX</a>
    </article>
  </main>

  <script type="module">
    import { HOBBY_IMAGES, HOBBY_META } from './gallery-data.js';

    const container = document.getElementById('hobbyGalleries');

    const hobbyIds = ['hobby-f1', 'hobby-basketball', 'hobby-cs', 'hobby-fitness'];
    let html = '';

    for (const id of hobbyIds) {
      const images = HOBBY_IMAGES[id] || [];
      const meta = HOBBY_META[id];
      if (!meta) continue;

      const hasImages = images.length > 0;

      html += `
        <div class="gallery-entry" ${hasImages ? '' : 'style="display:none"'}>
          <h2>// ${meta.name}</h2>
          <div class="gallery-thumbs">
            ${images.slice(0, 3).map(img => `
              <div class="thumb-item">
                <img src="${img.src}" alt="${img.desc}" loading="lazy">
              </div>
            `).join('')}
          </div>
          <a href="gallery.html?src=hobbies&id=${id}" class="gallery-link">查看全部 →</a>
        </div>
      `;
    }

    container.innerHTML = html;
  </script>
</body>
</html>
