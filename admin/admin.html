<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOB1S DEV PANEL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --carbon: #0a0a0c;
      --carbon-light: #111115;
      --carbon-card: #14141a;
      --neon: #bfff00;
      --neon-dim: rgba(191, 255, 0, 0.12);
      --neon-glow: rgba(191, 255, 0, 0.35);
      --neon-ghost: rgba(191, 255, 0, 0.06);
      --amber: #ff8c00;
      --amber-dim: rgba(255, 140, 0, 0.2);
      --titanium: #b0b0ba;
      --titanium-dim: #6a6a76;
      --white: #e8e8ec;
      --white-dim: #a0a0aa;
      --border-hairline: rgba(255, 255, 255, 0.05);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-active: rgba(191, 255, 0, 0.25);
      --font-display: 'Orbitron', system-ui, sans-serif;
      --font-mono: 'Space Mono', 'Consolas', monospace;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: var(--carbon); }
    body {
      font-family: var(--font-mono);
      background: var(--carbon);
      color: var(--white);
      line-height: 1.6;
      min-height: 100vh;
    }
    /* Telemetry bar */
    .tel-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.5rem 1.5rem;
      background: rgba(10,10,12,0.95); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-hairline);
      font-size: 0.6rem; letter-spacing: 0.08em;
    }
    .tel-bar .brand { font-family: var(--font-display); font-size: 0.8rem; font-weight: 800; letter-spacing: 0.2em; }
    .tel-bar .accent { color: var(--neon); }
    .tel-bar .status { color: var(--neon); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
    .tel-bar .logout-btn {
      background: none; border: 1px solid var(--border-subtle); color: var(--titanium-dim);
      font-family: var(--font-mono); font-size: 0.55rem; font-weight: 700;
      letter-spacing: 0.1em; padding: 0.2rem 0.6rem; cursor: pointer;
      transition: all 0.3s;
    }
    .tel-bar .logout-btn:hover { border-color: var(--amber); color: var(--amber); }

    /* Layout */
    .app { display: flex; padding-top: 2.5rem; min-height: 100vh; }
    .sidebar {
      width: 180px; flex-shrink: 0; padding: 2rem 1rem;
      border-right: 1px solid var(--border-hairline);
      position: sticky; top: 2.5rem; height: calc(100vh - 2.5rem);
    }
    .nav-item {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.5rem 0.6rem; margin-bottom: 0.3rem;
      cursor: pointer; border-radius: 2px;
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.15em;
      color: var(--titanium-dim); transition: all 0.3s;
      text-transform: uppercase;
    }
    .nav-item::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: var(--titanium-dim); flex-shrink: 0;
      transition: all 0.3s;
    }
    .nav-item:hover { color: var(--white); }
    .nav-item:hover::before { background: var(--white); }
    .nav-item.active { color: var(--neon); }
    .nav-item.active::before { background: var(--neon); box-shadow: 0 0 8px var(--neon-glow); }

    .content { flex: 1; padding: 2rem 2.5rem; max-width: 900px; }

    /* Section */
    .section-header {
      display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem;
    }
    .section-index {
      font-size: 0.55rem; font-weight: 700; letter-spacing: 0.25em;
      color: var(--neon); padding: 0.2rem 0.5rem;
      border: 1px solid var(--neon-dim); border-radius: 1px;
    }
    .section-title {
      font-family: var(--font-display); font-size: 1.2rem; font-weight: 800;
      letter-spacing: 0.05em; text-transform: uppercase;
    }

    /* Cards */
    .card {
      background: var(--carbon-card); border: 1px solid var(--border-subtle);
      border-radius: 2px; padding: 1.2rem; margin-bottom: 1rem;
      transition: border-color 0.3s;
    }
    .card:hover { border-color: var(--border-active); }
    .card-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1rem; padding-bottom: 0.6rem;
      border-bottom: 1px solid var(--border-hairline);
    }
    .card-key {
      font-size: 0.6rem; font-weight: 700; letter-spacing: 0.15em;
      color: var(--neon); padding: 0.15rem 0.4rem;
      border: 1px solid var(--neon-dim); border-radius: 1px;
    }
    .card-actions { display: flex; gap: 0.5rem; }

    /* Form elements */
    label {
      display: block; font-size: 0.55rem; font-weight: 700;
      letter-spacing: 0.15em; color: var(--titanium-dim);
      margin-bottom: 0.3rem; text-transform: uppercase;
    }
    input, textarea, select {
      width: 100%; background: transparent;
      border: 1px solid var(--border-hairline); border-radius: 1px;
      color: var(--white); font-family: var(--font-mono); font-size: 0.75rem;
      padding: 0.45rem 0.6rem; outline: none;
      transition: border-color 0.3s;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--neon); }
    textarea { resize: vertical; min-height: 60px; }
    select { cursor: pointer; }
    select option { background: var(--carbon-card); color: var(--white); }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; margin-bottom: 0.8rem; }
    .form-group { margin-bottom: 0.8rem; }

    /* Buttons */
    .btn {
      background: transparent; border: 1px solid var(--border-subtle);
      color: var(--titanium-dim); font-family: var(--font-mono);
      font-size: 0.6rem; font-weight: 700; letter-spacing: 0.1em;
      padding: 0.35rem 0.8rem; cursor: pointer; border-radius: 1px;
      transition: all 0.3s; text-transform: uppercase;
    }
    .btn:hover { border-color: var(--neon); color: var(--neon); }
    .btn-danger:hover { border-color: #ff4444; color: #ff4444; }
    .btn-primary {
      border-color: var(--neon-dim); color: var(--neon);
      background: var(--neon-ghost);
    }
    .btn-primary:hover { background: var(--neon-dim); }

    /* Tags input */
    .tags-container {
      display: flex; flex-wrap: wrap; gap: 0.4rem;
      padding: 0.4rem; border: 1px solid var(--border-hairline);
      border-radius: 1px; min-height: 36px;
    }
    .tag {
      display: flex; align-items: center; gap: 0.3rem;
      background: var(--neon-ghost); border: 1px solid var(--neon-dim);
      padding: 0.15rem 0.4rem; border-radius: 1px;
      font-size: 0.65rem; color: var(--neon);
    }
    .tag-remove {
      cursor: pointer; color: var(--titanium-dim); font-size: 0.8rem;
      line-height: 1; transition: color 0.2s;
    }
    .tag-remove:hover { color: #ff4444; }
    .tags-input {
      border: none !important; padding: 0.2rem !important;
      flex: 1; min-width: 80px; font-size: 0.7rem !important;
    }

    /* Stats rows */
    .stat-row {
      display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.4rem;
    }
    .stat-row input { flex: 1; }
    .stat-remove {
      background: none; border: none; color: var(--titanium-dim);
      cursor: pointer; font-size: 1rem; padding: 0.2rem;
      transition: color 0.2s;
    }
    .stat-remove:hover { color: #ff4444; }

    /* Image grid */
    .image-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 0.8rem; margin-top: 1rem;
    }
    .image-card {
      background: var(--carbon-card); border: 1px solid var(--border-subtle);
      border-radius: 2px; overflow: hidden;
    }
    .image-card img {
      width: 100%; height: 120px; object-fit: cover; display: block;
    }
    .image-card .image-info {
      padding: 0.5rem;
    }
    .image-desc-input {
      width: 100%; background: transparent; border: 1px solid transparent;
      color: var(--white-dim); font-family: var(--font-mono); font-size: 0.65rem;
      padding: 0.2rem 0.3rem; outline: none; border-radius: 1px;
      transition: border-color 0.3s, color 0.3s;
    }
    .image-desc-input:hover { border-color: var(--border-hairline); }
    .image-desc-input:focus { border-color: var(--neon); color: var(--white); }
    .image-card .image-src {
      font-size: 0.55rem; color: var(--titanium-dim);
      word-break: break-all;
    }

    /* Upload area */
    .upload-area {
      border: 2px dashed var(--border-subtle); border-radius: 2px;
      padding: 1.5rem; text-align: center; margin-bottom: 1rem;
      transition: border-color 0.3s; cursor: pointer;
    }
    .upload-area:hover { border-color: var(--neon); }
    .upload-area.dragover { border-color: var(--neon); background: var(--neon-ghost); }
    .upload-text { font-size: 0.7rem; color: var(--titanium-dim); }
    .upload-text .accent { color: var(--neon); }

    /* Entry list */
    .entry-list {
      display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem;
    }
    .entry-chip {
      background: var(--carbon-card); border: 1px solid var(--border-subtle);
      padding: 0.3rem 0.7rem; border-radius: 1px;
      font-size: 0.65rem; font-weight: 700; cursor: pointer;
      color: var(--white-dim); transition: all 0.3s;
    }
    .entry-chip:hover { border-color: var(--border-active); color: var(--white); }
    .entry-chip.active { border-color: var(--neon); color: var(--neon); background: var(--neon-ghost); }

    /* Toast */
    .toast {
      position: fixed; bottom: 2rem; right: 2rem; z-index: 999;
      background: var(--carbon-card); border: 1px solid var(--neon-dim);
      color: var(--neon); padding: 0.6rem 1.2rem;
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em;
      border-radius: 2px; opacity: 0; transform: translateY(10px);
      transition: all 0.3s; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { border-color: rgba(255,68,68,0.3); color: #ff4444; }

    /* Password overlay */
    .auth-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--carbon);
      display: flex; align-items: center; justify-content: center;
    }
    .auth-box {
      text-align: center; max-width: 320px; width: 100%;
    }
    .auth-box h1 {
      font-family: var(--font-display); font-size: 1.5rem; font-weight: 900;
      margin-bottom: 0.5rem; letter-spacing: 0.1em;
    }
    .auth-box .sub { font-size: 0.65rem; color: var(--titanium-dim); margin-bottom: 2rem; }
    .auth-box input {
      text-align: center; margin-bottom: 1rem;
      font-size: 0.85rem; padding: 0.6rem;
    }
    .auth-error { color: #ff4444; font-size: 0.65rem; margin-bottom: 1rem; min-height: 1.2em; }

    /* Tab bar for images */
    .tab-bar {
      display: flex; gap: 0; margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-hairline);
    }
    .tab-item {
      padding: 0.5rem 1rem; cursor: pointer;
      font-size: 0.6rem; font-weight: 700; letter-spacing: 0.15em;
      color: var(--titanium-dim); text-transform: uppercase;
      border-bottom: 2px solid transparent;
      transition: all 0.3s;
    }
    .tab-item:hover { color: var(--white); }
    .tab-item.active { color: var(--neon); border-bottom-color: var(--neon); }

    /* Section visibility */
    .module { display: none; }
    .module.active { display: block; }

    /* Loading */
    .loading {
      text-align: center; padding: 3rem;
      font-size: 0.7rem; color: var(--titanium-dim);
    }
  </style>
</head>
<body>
  <!-- Auth overlay -->
  <div class="auth-overlay" id="authOverlay">
    <div class="auth-box">
      <h1>MOB<span style="color:var(--neon)">1S</span></h1>
      <div class="sub">DEV PANEL AUTHENTICATION</div>
      <input type="password" id="authInput" placeholder="PASSWORD" autocomplete="off">
      <div class="auth-error" id="authError"></div>
      <button class="btn btn-primary" onclick="doAuth()" style="width:100%">AUTHENTICATE</button>
    </div>
  </div>

  <!-- Main app -->
  <div id="app" style="display:none">
    <div class="tel-bar">
      <span class="brand">MOB<span class="accent">1S</span></span>
      <span>DEV_PANEL</span>
      <span class="status">ONLINE</span>
      <span id="telTime">--:--:--</span>
      <button class="logout-btn" onclick="logout()">LOGOUT</button>
    </div>

    <div class="app">
      <nav class="sidebar">
        <div class="nav-item active" data-module="traveled" onclick="switchModule('traveled')">足迹</div>
        <div class="nav-item" data-module="profiles" onclick="switchModule('profiles')">城市档案</div>
        <div class="nav-item" data-module="images" onclick="switchModule('images')">图片</div>
        <div class="nav-item" data-module="hobbies" onclick="switchModule('hobbies')">爱好</div>
        <div class="nav-item" data-module="people" onclick="switchModule('people')">人物</div>
        <div class="nav-item" data-module="site" onclick="switchModule('site')">站点设置</div>
      </nav>

      <main class="content">
        <!-- Module: Traveled Cities -->
        <div class="module active" id="mod-traveled">
          <div class="section-header">
            <span class="section-index">SECTOR 01</span>
            <span class="section-title">TRAVELED_CITIES</span>
          </div>
          <div class="entry-list" id="traveledList"></div>
          <div id="traveledForm"></div>
          <button class="btn btn-primary" onclick="addTraveled()" style="margin-top:1rem">+ ADD CITY</button>
        </div>

        <!-- Module: City Profiles -->
        <div class="module" id="mod-profiles">
          <div class="section-header">
            <span class="section-index">SECTOR 02</span>
            <span class="section-title">CITY_PROFILES</span>
          </div>
          <div class="entry-list" id="profilesList"></div>
          <div id="profilesForm"></div>
        </div>

        <!-- Module: Images -->
        <div class="module" id="mod-images">
          <div class="section-header">
            <span class="section-index">SECTOR 03</span>
            <span class="section-title">IMAGES</span>
          </div>
          <div class="tab-bar">
            <div class="tab-item active" onclick="switchImageTab('city')">城市</div>
            <div class="tab-item" onclick="switchImageTab('district')">区级</div>
            <div class="tab-item" onclick="switchImageTab('hobby')">爱好</div>
            <div class="tab-item" onclick="switchImageTab('person')">人物</div>
          </div>
          <div id="imageContent"></div>
        </div>

        <!-- Module: Hobbies -->
        <div class="module" id="mod-hobbies">
          <div class="section-header">
            <span class="section-index">SECTOR 04</span>
            <span class="section-title">HOBBY_PROFILES</span>
          </div>
          <div class="entry-list" id="hobbiesList"></div>
          <div id="hobbiesForm"></div>
        </div>

        <!-- Module: People -->
        <div class="module" id="mod-people">
          <div class="section-header">
            <span class="section-index">SECTOR 05</span>
            <span class="section-title">PERSON_PROFILES</span>
          </div>
          <div class="entry-list" id="peopleList"></div>
          <div id="peopleForm"></div>
        </div>

        <!-- Module: Site Config -->
        <div class="module" id="mod-site">
          <div class="section-header">
            <span class="section-index">SECTOR 06</span>
            <span class="section-title">SITE_CONFIG</span>
          </div>
          <div id="siteConfigForm"></div>
        </div>
      </main>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // --- State ---
    let PASSWORD = '';
    let provinces = [];
    let currentModule = 'traveled';
    let imageTab = 'city';

    // Data caches
    let traveledData = {};
    let cityProfilesData = {};
    let cityImagesData = {};
    let districtImagesData = {};
    let districtNotesData = {};
    let wishlistData = {};
    let hobbyProfilesData = {};
    let personProfilesData = {};
    let hobbyImagesData = {};
    let personImagesData = {};
    let hobbyMetaData = {};
    let personMetaData = {};
    let siteConfigData = {};

    // Selected keys
    let selectedTraveled = null;
    let selectedProfile = null;
    let selectedHobby = null;
    let selectedPerson = null;

    // --- Auth ---
    function doAuth() {
      const pw = document.getElementById('authInput').value;
      PASSWORD = pw;
      apiFetch('/api/traveled-cities').then(data => {
        if (data && !data.error) {
          document.getElementById('authOverlay').style.display = 'none';
          document.getElementById('app').style.display = 'block';
          sessionStorage.setItem('devpanel_pw', pw);
          init();
        } else {
          document.getElementById('authError').textContent = 'WRONG PASSWORD';
        }
      }).catch(() => {
        document.getElementById('authError').textContent = 'CONNECTION FAILED';
      });
    }

    function logout() {
      sessionStorage.removeItem('devpanel_pw');
      PASSWORD = '';
      document.getElementById('app').style.display = 'none';
      document.getElementById('authOverlay').style.display = 'flex';
      document.getElementById('authInput').value = '';
      document.getElementById('authError').textContent = '';
    }

    // Auto-login from session
    (function() {
      const saved = sessionStorage.getItem('devpanel_pw');
      if (saved) {
        PASSWORD = saved;
        apiFetch('/api/traveled-cities').then(data => {
          if (data && !data.error) {
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            init();
          }
        }).catch(() => {});
      }
      document.getElementById('authInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') doAuth();
      });
    })();

    // --- API helpers ---
    function apiFetch(url, opts = {}) {
      const headers = { 'Authorization': 'Bearer ' + PASSWORD, ...opts.headers };
      if (opts.body && typeof opts.body === 'object' && !opts.body._multipart) {
        headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(opts.body);
      }
      return fetch(url, { ...opts, headers }).then(r => r.json());
    }

    // --- Init ---
    async function init() {
      const results = await Promise.all([
        apiFetch('/api/provinces'),
        apiFetch('/api/traveled-cities'),
        apiFetch('/api/city-profiles'),
        apiFetch('/api/city-images'),
        apiFetch('/api/district-notes'),
        apiFetch('/api/wishlist-impressions'),
        apiFetch('/api/hobby-profiles'),
        apiFetch('/api/person-profiles'),
        apiFetch('/api/hobby-images'),
        apiFetch('/api/person-images'),
        apiFetch('/api/hobby-meta'),
        apiFetch('/api/person-meta'),
        apiFetch('/api/district-images'),
        apiFetch('/api/site-config'),
      ]);
      provinces = results[0] || [];
      traveledData = results[1] || {};
      cityProfilesData = results[2] || {};
      cityImagesData = results[3] || {};
      districtNotesData = results[4] || {};
      wishlistData = results[5] || {};
      hobbyProfilesData = results[6] || {};
      personProfilesData = results[7] || {};
      hobbyImagesData = results[8] || {};
      personImagesData = results[9] || {};
      hobbyMetaData = results[10] || {};
      personMetaData = results[11] || {};
      districtImagesData = results[12] || {};
      siteConfigData = results[13] || {};

      renderTraveled();
      renderProfiles();
      renderImages();
      renderHobbies();
      renderPeople();
      renderSiteConfig();
      startClock();
    }

    // --- Clock ---
    function startClock() {
      const el = document.getElementById('telTime');
      setInterval(() => {
        const n = new Date();
        el.textContent = n.toTimeString().slice(0, 8);
      }, 1000);
    }

    // --- Module switching ---
    function switchModule(name) {
      currentModule = name;
      document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.module === name));
      document.querySelectorAll('.module').forEach(m => m.classList.toggle('active', m.id === 'mod-' + name));
    }

    // --- Toast ---
    function toast(msg, isError = false) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show' + (isError ? ' error' : '');
      setTimeout(() => el.className = 'toast', 2500);
    }

    // =============================================
    // TRAVELED CITIES
    // =============================================
    function renderTraveled() {
      const list = document.getElementById('traveledList');
      list.innerHTML = Object.keys(traveledData).map(k =>
        `<div class="entry-chip ${selectedTraveled===k?'active':''}" onclick="selectTraveled('${k}')">${traveledData[k].name}</div>`
      ).join('');
      if (selectedTraveled) renderTraveledForm();
      else document.getElementById('traveledForm').innerHTML = '';
    }

    function selectTraveled(key) {
      selectedTraveled = key;
      renderTraveled();
    }

    function renderTraveledForm() {
      const d = traveledData[selectedTraveled] || {};
      document.getElementById('traveledForm').innerHTML = `
        <div class="card">
          <div class="card-header">
            <span class="card-key">${selectedTraveled}</span>
            <div class="card-actions">
              <button class="btn btn-danger" onclick="deleteTraveled()">DELETE</button>
              <button class="btn btn-primary" onclick="saveTraveled()">SAVE</button>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>城市</label>
              <input id="tc_name" value="${esc(d.name||'')}" placeholder="城市名">
            </div>
            <div class="form-group">
              <label>省份</label>
              <input id="tc_province" value="${esc(d.province||'')}" placeholder="省份">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>天数</label>
              <input id="tc_days" value="${esc(d.days||'')}" placeholder="可选">
            </div>
            <div class="form-group">
              <label>年份</label>
              <input id="tc_year" value="${esc(d.year||'')}" placeholder="可选">
            </div>
          </div>
        </div>`;
    }

    async function saveTraveled() {
      const data = {
        name: gv('tc_name'),
        province: gv('tc_province'),
      };
      if (gv('tc_days')) data.days = gv('tc_days');
      if (gv('tc_year')) data.year = gv('tc_year');

    // 压缩图片
    function compressImage(file, maxWidth = 1920, quality = 0.85) {
      return new Promise((resolve) => {
        // 小于 500KB 的不压缩
        if (file.size < 500 * 1024) return resolve(file);

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();

        img.onload = () => {
          let width = img.width;
          let height = img.height;

          // 缩放
          if (width > maxWidth) {
            height = Math.round(height * maxWidth / width);
            width = maxWidth;
          }

          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);

          canvas.toBlob((blob) => {
            const originalKB = Math.round(file.size / 1024);
            const compressedKB = Math.round(blob.size / 1024);
            console.log(`压缩: ${originalKB}KB → ${compressedKB}KB`);
            resolve(new File([blob], file.name, { type: 'image/jpeg' }));
          }, 'image/jpeg', quality);
        };

        img.src = URL.createObjectURL(file);
      });
    }

    async function uploadSingleFile(file, key, dir) {
      // 压缩图片
      const compressed = await compressImage(file);
      const form = new FormData();
      form.append('file', compressed);
      form.append('dir', dir);

      const res = await fetch('/api/upload-image', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + PASSWORD },
        body: form,
      });
      const result = await res.json();
      if (result.error) throw new Error(result.error);

      const newImg = { src: result.path, desc: file.name.replace(/\.[^.]+$/, '') };

      const dataMap = { city: cityImagesData, district: districtImagesData, hobby: hobbyImagesData, person: personImagesData };
      const apiMap = { city: 'city-images', district: 'district-images', hobby: 'hobby-images', person: 'person-images' };

      dataMap[imageTab][key].push(newImg);

      await apiFetch('/api/' + apiMap[imageTab] + '/' + key, {
        method: 'PUT',
        body: dataMap[imageTab][key],
      });
    }

      const list = document.getElementById('peopleList');
      const keys = Object.keys(personProfilesData);
      list.innerHTML = keys.map(k =>
        `<div class="entry-chip ${selectedPerson===k?'active':''}" onclick="selectPerson('${k}')">${personProfilesData[k].name||k}</div>`
      ).join('');
      if (selectedPerson) renderPersonForm();
      else document.getElementById('peopleForm').innerHTML = '';
    }

    function selectPerson(key) {
      selectedPerson = key;
      renderPeople();
    }

    function renderPersonForm() {
      const d = personProfilesData[selectedPerson] || {};
      const meta = personMetaData[selectedPerson] || {};
      const statsHtml = (d.stats || []).map((s, i) =>
        `<div class="stat-row">
          <input class="stat-v" value="${esc(s.v||'')}" placeholder="值" title="值">
          <input class="stat-l" value="${esc(s.l||'')}" placeholder="标签" title="标签">
          <button class="stat-remove" onclick="this.parentElement.remove()">&times;</button>
        </div>`
      ).join('');
      const bioHtml = (d.bio || []).map((b, i) =>
        `<div class="form-group" style="position:relative">
          <textarea class="bio-item" rows="3" placeholder="输入段落...">${esc(b)}</textarea>
          <button class="stat-remove" style="position:absolute;top:0;right:0" onclick="this.parentElement.remove()">&times;</button>
        </div>`
      ).join('');
      const achHtml = (d.achievements || []).map((a, i) =>
        `<div class="form-group" style="position:relative">
          <input class="ach-item" value="${esc(a)}" placeholder="成就...">
          <button class="stat-remove" style="position:absolute;top:0;right:0" onclick="this.parentElement.remove()">&times;</button>
        </div>`
      ).join('');

      document.getElementById('peopleForm').innerHTML = `
        <div class="card">
          <div class="card-header">
            <span class="card-key">${selectedPerson}</span>
            <div class="card-actions">
              <button class="btn btn-primary" onclick="savePerson()">SAVE</button>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>名称</label>
              <input id="pp_name" value="${esc(d.name||'')}" placeholder="人物名">
            </div>
            <div class="form-group">
              <label>Tag</label>
              <input id="pp_tag" value="${esc(d.tag||'')}" placeholder="标签">
            </div>
          </div>
          <div class="form-group">
            <label>Role</label>
            <input id="pp_role" value="${esc(d.role||'')}" placeholder="角色/定位">
          </div>
          <div class="form-group">
            <label>Bio (每段一条)</label>
            <div id="pp_bio_list">${bioHtml}</div>
            <button class="btn" onclick="addPersonBioRow()" style="margin-top:0.4rem">+ ADD</button>
          </div>
          <div class="form-group">
            <label>Stats</label>
            <div id="pp_stats_list">${statsHtml}</div>
            <button class="btn" onclick="addStatRow('pp_stats_list')" style="margin-top:0.4rem">+ ADD</button>
          </div>
          <div class="form-group">
            <label>Achievements</label>
            <div id="pp_ach_list">${achHtml}</div>
            <button class="btn" onclick="addAchRow()" style="margin-top:0.4rem">+ ADD</button>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Meta Name</label>
              <input id="pp_meta_name" value="${esc(meta.name||'')}" placeholder="显示名">
            </div>
            <div class="form-group">
              <label>Meta Tag</label>
              <input id="pp_meta_tag" value="${esc(meta.tag||'')}" placeholder="标签">
            </div>
          </div>
        </div>`;
    }

    async function savePerson() {
      const stats = [];
      document.querySelectorAll('#pp_stats_list .stat-row').forEach(row => {
        stats.push({ v: row.querySelector('.stat-v').value, l: row.querySelector('.stat-l').value });
      });
      const bio = Array.from(document.querySelectorAll('#pp_bio_list .bio-item')).map(t => t.value).filter(Boolean);
      const achievements = Array.from(document.querySelectorAll('#pp_ach_list .ach-item')).map(t => t.value).filter(Boolean);
      const data = {
        name: gv('pp_name'),
        tag: gv('pp_tag'),
        role: gv('pp_role'),
        bio,
        stats,
        achievements,
      };
      await apiFetch('/api/person-profiles/' + selectedPerson, { method: 'PUT', body: data });
      personProfilesData[selectedPerson] = data;

      const meta = {
        name: gv('pp_meta_name'),
        tag: gv('pp_meta_tag'),
        backUrl: 'detail.html?id=' + selectedPerson,
      };
      await apiFetch('/api/person-meta/' + selectedPerson, { method: 'PUT', body: meta });
      personMetaData[selectedPerson] = meta;

      toast('SAVED');
    }

    function addPersonBioRow() {
      const div = document.createElement('div');
      div.className = 'form-group';
      div.style.position = 'relative';
      div.innerHTML = `<textarea class="bio-item" rows="3" placeholder="新段落..." title="段落"></textarea>
        <button class="stat-remove" style="position:absolute;top:0;right:0" onclick="this.parentElement.remove()">&times;</button>`;
      document.getElementById('pp_bio_list').appendChild(div);
    }

    function addAchRow() {
      const div = document.createElement('div');
      div.className = 'form-group';
      div.style.position = 'relative';
      div.innerHTML = `<input class="ach-item" placeholder="新成就..." title="成就">
        <button class="stat-remove" style="position:absolute;top:0;right:0" onclick="this.parentElement.remove()">&times;</button>`;
      document.getElementById('pp_ach_list').appendChild(div);
    }

    // --- Site Config ---
    function renderSiteConfig() {
      const credits = siteConfigData.credits || {};
      document.getElementById('siteConfigForm').innerHTML = `
        <div class="card">
          <div class="card-header">
            <span class="card-key">CREDITS</span>
            <div class="card-actions">
              <button class="btn btn-primary" onclick="saveSiteConfig()">SAVE</button>
            </div>
          </div>
          <div class="form-group">
            <label>致谢内容</label>
            <textarea id="sc_credits_text" rows="8" placeholder="输入致谢文字...">${esc(credits.text || '')}</textarea>
          </div>
        </div>`;
    }

    async function saveSiteConfig() {
      try {
        const credits = { text: gv('sc_credits_text') };
        console.log('[SiteConfig] Saving:', credits);
        const res = await apiFetch('/api/site-config/credits', { method: 'PUT', body: credits });
        console.log('[SiteConfig] Response:', res);
        if (res && res.error) {
          toast('ERROR: ' + res.error, true);
          return;
        }
        siteConfigData.credits = credits;
        toast('SAVED');
      } catch (e) {
        console.error('[SiteConfig] Save failed:', e);
        toast('SAVE FAILED: ' + e.message, true);
      }
    }

    // --- Utilities ---
    function gv(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }
    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  </script>
</body>
</html>
