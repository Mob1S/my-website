<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TELEMETRY | Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    /* ============================================
       Detail Page — Carbon Telemetry
       ============================================ */
    :root {
      --carbon: #0a0a0c;
      --carbon-light: #111115;
      --carbon-card: #14141a;
      --neon: #bfff00;
      --neon-dim: rgba(191, 255, 0, 0.12);
      --neon-glow: rgba(191, 255, 0, 0.35);
      --neon-ghost: rgba(191, 255, 0, 0.06);
      --amber: #ff8c00;
      --amber-dim: rgba(255, 140, 0, 0.2);
      --titanium: #a0a0aa;
      --titanium-dim: #5a5a66;
      --white: #e8e8ec;
      --white-dim: #90909a;
      --border-hairline: rgba(255, 255, 255, 0.05);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-active: rgba(191, 255, 0, 0.25);
      --font-display: 'Orbitron', system-ui, sans-serif;
      --font-mono: 'Space Mono', 'Consolas', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-mono);
      background: var(--carbon);
      color: var(--white);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    /* Carbon overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.05;
      background:
        repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(255,255,255,0.008) 2px, rgba(255,255,255,0.008) 4px),
        radial-gradient(ellipse at 50% 0%, rgba(191,255,0,0.04) 0%, transparent 60%);
    }

    /* Telemetry grid */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.03;
      background:
        linear-gradient(90deg, var(--white) 1px, transparent 1px),
        linear-gradient(0deg, var(--white) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse at 50% 30%, black 35%, transparent 70%);
    }

    /* --- Top bar --- */
    .top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 1.5rem;
      background: rgba(10, 10, 12, 0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-hairline);
      font-family: var(--font-mono);
      font-size: 0.65rem;
    }

    .bar-back {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--white-dim);
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 0.15em;
      transition: color 0.3s;
    }

    .bar-back:hover { color: var(--neon); }

    .bar-back-arrow {
      color: var(--neon);
      font-size: 0.85rem;
      line-height: 1;
    }

    .bar-brand {
      font-family: var(--font-display);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      color: var(--white);
    }

    .bar-brand span { color: var(--neon); }

    .bar-mode {
      color: var(--neon);
      font-weight: 700;
      letter-spacing: 0.15em;
      font-size: 0.55rem;
      border: 1px solid var(--neon-dim);
      padding: 0.2rem 0.6rem;
    }

    /* --- Hero --- */
    .profile-hero {
      min-height: 50vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      z-index: 1;
      padding: 7rem 2rem 3rem;
    }

    .hero-tag {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      color: var(--neon);
      border: 1px solid var(--neon);
      padding: 0.4rem 1.2rem;
      margin-bottom: 1.5rem;
    }

    .hero-name {
      font-family: var(--font-display);
      font-size: clamp(2.8rem, 8vw, 6rem);
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    .hero-name .hl {
      color: var(--neon);
      text-shadow: 0 0 80px var(--neon-glow);
    }

    .hero-role {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--titanium);
      margin-top: 0.8rem;
    }

    /* --- Content --- */
    .profile-content {
      position: relative;
      z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 0 2rem 5rem;
    }

    /* Stats row */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
      margin-bottom: 3rem;
    }

    .stat-block {
      background: var(--carbon-card);
      border: 1px solid var(--border-subtle);
      text-align: center;
      padding: 1.5rem 0.8rem;
    }

    .stat-val {
      font-family: var(--font-display);
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--neon);
      line-height: 1.1;
    }

    .stat-lbl {
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--titanium-dim);
      margin-top: 0.5rem;
      text-transform: uppercase;
    }

    /* Bio + details grid */
    .profile-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
    }

    /* Bio */
    .bio-section h2 {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: var(--neon);
      margin-bottom: 1.2rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-active);
    }

    .bio-section p {
      font-size: 0.82rem;
      color: var(--white-dim);
      line-height: 1.85;
      margin-bottom: 1rem;
    }

    /* Achievements sidebar */
    .achieve-section h2 {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: var(--neon);
      margin-bottom: 1.2rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-active);
    }

    .achieve-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .achieve-item {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      font-size: 0.78rem;
      color: var(--white-dim);
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border-hairline);
    }

    .achieve-marker {
      color: var(--neon);
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 0.15rem;
    }

    /* --- Not found --- */
    .not-found {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      z-index: 1;
      padding: 2rem;
    }

    .not-found h2 {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 900;
      color: var(--neon);
      margin-bottom: 1rem;
    }

    .not-found a {
      color: var(--neon);
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      margin-top: 1rem;
      transition: opacity 0.3s;
    }

    .not-found a:hover { opacity: 0.7; }

    /* --- Gallery Entry --- */
    .gallery-entry {
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-active);
    }
    .gallery-entry h2 {
      font-family: var(--font-mono); font-size: 0.6rem; font-weight: 700;
      letter-spacing: 0.25em; color: var(--neon); margin-bottom: 1rem;
    }
    .gallery-thumbs {
      display: flex; gap: 0.8rem; margin-bottom: 1rem;
    }
    .thumb-item {
      width: 80px; height: 80px; overflow: hidden;
      border: 1px solid var(--border-active); border-radius: 2px;
      transition: transform 0.2s ease;
    }
    .thumb-item:hover { transform: scale(1.05); }
    .thumb-item img { width: 100%; height: 100%; object-fit: cover; }
    .gallery-link {
      display: inline-flex; align-items: center; gap: 0.3rem;
      font-family: var(--font-mono); font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.1em; color: var(--neon); text-decoration: none;
      transition: gap 0.3s;
    }
    .gallery-link:hover { gap: 0.6rem; }

    /* --- Responsive --- */
    @media (max-width: 768px) {
      .stats-row { grid-template-columns: 1fr 1fr; }
      .profile-grid { grid-template-columns: 1fr; gap: 2rem; }
      .stat-val { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <a class="bar-back" href="index.html#hobbies">
      <span class="bar-back-arrow">&larr;</span>
      <span>BACK TO HOME</span>
    </a>
    <div class="bar-brand">MOB<span>1S</span></div>
    <span class="bar-mode">TELEMETRY</span>
  </header>

  <main id="app">
    <!-- Rendered by JS -->
  </main>

  <script type="module">

    // Load data from JSON files
    const [PROFILES, HOBBY_STORIES, PERSON_IMAGES, HOBBY_IMAGES, PERSON_META, HOBBY_META] = await Promise.all([
      fetch('admin/data/person-profiles.json').then(r => r.json()),
      fetch('admin/data/hobby-profiles.json').then(r => r.json()),
      fetch('admin/data/person-images.json').then(r => r.json()),
      fetch('admin/data/hobby-images.json').then(r => r.json()),
      fetch('admin/data/person-meta.json').then(r => r.json()),
      fetch('admin/data/hobby-meta.json').then(r => r.json()),
    ]);

    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const data = PROFILES[id] || HOBBY_STORIES[id];

    const app = document.getElementById('app');

    if (!data) {
      app.innerHTML = `
        <div class="not-found">
          <h2>DATA NOT FOUND</h2>
          <p style="color:var(--titanium-dim);margin-bottom:1.5rem;font-size:0.8rem;">NO TELEMETRY FOR SPECIFIED ID</p>
          <a href="index.html#hobbies">&larr; RETURN TO HOME</a>
        </div>
      `;
      document.title = '404 | Telemetry';
    } else {
      document.title = data.name + ' | Telemetry';

      const statsHTML = data.stats.map(s => `
        <div class="stat-block">
          <div class="stat-val">${s.v}</div>
          <div class="stat-lbl">${s.l}</div>
        </div>
      `).join('');

      const bioHTML = data.bio.map(p => `<p>${p}</p>`).join('');

      const achieveHTML = data.achievements.map(a => `
        <div class="achieve-item">
          <span class="achieve-marker">&diams;</span>
          <span>${a}</span>
        </div>
      `).join('');

      app.innerHTML = `
        <div class="profile-hero">
          <div>
            <div class="hero-tag">${data.tag}</div>
            <h1 class="hero-name">${data.name}</h1>
            <p class="hero-role">${data.role}</p>
          </div>
        </div>
        <div class="profile-content">
          <div class="stats-row">${statsHTML}</div>
          <div class="profile-grid">
            <div class="bio-section">
              <h2>// Biography</h2>
              ${bioHTML}
            </div>
            <div class="achieve-section">
              <h2>// Achievements &amp; Highlights</h2>
              <div class="achieve-list">${achieveHTML}</div>
            </div>
          </div>
          ${(PERSON_IMAGES[id] && PERSON_IMAGES[id].length > 0) ? `
          <div class="gallery-entry">
            <h2>// 图片集</h2>
            <div class="gallery-thumbs">
              ${PERSON_IMAGES[id].slice(0, 3).map(img => `
                <div class="thumb-item">
                  <img src="${img.src}" alt="${img.desc}" loading="lazy">
                </div>
              `).join('')}
            </div>
            <a href="gallery.html?src=person&id=${id}" class="gallery-link">查看全部 →</a>
          </div>
          ` : ''}
        </div>
      `;
    }
  </script>
</body>
</html>
